services:
  mysql:
    image: mysql:8.4
    container_name: senai-chamados-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: senai_chamados
      MYSQL_USER: senai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-troque-esta-senha}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-troque-esta-senha-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
